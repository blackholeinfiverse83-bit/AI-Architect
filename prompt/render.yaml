services:
  # Design Engine Backend (FastAPI + MongoDB)
  - type: web
    name: design-engine-api
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: prompt/Design-Engine-/backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: bhiv_db
      - key: GROQ_API_KEY
        sync: false
      - key: MESHY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_METRICS
        value: "false"
      - key: USE_AI_MODEL
        value: "true"
      - key: CORS_ORIGINS
        value: "https://bhiv-design-engine-frontend.onrender.com,http://localhost:3000"

  # Frontend Web App (Static Express server)
  - type: web
    name: bhiv-design-engine-frontend
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: prompt/frontend-webapp
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
