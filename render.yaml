# Deploy to Render: https://dashboard.render.com
# Connect this repo (AI-Architect) and Render will use this blueprint.

services:
  # Backend API (FastAPI)
  - type: web
    name: design-engine-api
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: prompt/Design-Engine-/backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: bhiv_db
      - key: JWT_SECRET_KEY
        sync: false
      - key: DEMO_USERNAME
        value: admin
      - key: DEMO_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MESHY_API_KEY
        sync: false
      - key: TRIPO_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://ai-architect-gray.vercel.app", "*"]'
      - key: CORS_CREDENTIALS
        value: "false"
      - key: USE_AI_MODEL
        value: "true"
      - key: ENABLE_METRICS
        value: "false"
